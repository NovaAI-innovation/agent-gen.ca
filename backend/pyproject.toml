[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gen-backend"
version = "0.1.0"
description = "FastAPI backend for agent-gen.ca — AI Agent Marketplace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic",
    "python-jose[cryptography]",
    "PyNaCl>=1.5.0",
    "base58>=2.1.1",
    "python-multipart",
    "slowapi",
    "structlog",
    "python-dotenv",
    "httpx",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "black",
    "isort",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
