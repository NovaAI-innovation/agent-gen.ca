name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentgen
          POSTGRES_USER: agentgen
          POSTGRES_PASSWORD: agentgen123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgen -d agentgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://agentgen:agentgen123@localhost:5432/agentgen
      SECRET_KEY: ci-secret-key
      ENFORCE_ALEMBIC_VERSION: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          cd backend
          pip install -e .[dev]
      - name: Run migrations
        run: |
          cd db
          alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          pytest -q
