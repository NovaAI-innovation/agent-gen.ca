version: '3.8'

services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: ./dockerfiles/Dockerfile.frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    expose:
      - '3000'

  backend:
    build:
      context: ../backend
      dockerfile: ./dockerfiles/Dockerfile.backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://agentgen:${POSTGRES_PASSWORD}@db:5432/agentgen
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: agentgen
      POSTGRES_USER: agentgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dockerfiles/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgen -d agentgen']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  certs:

networks:
  default:
    name: agentgen_prod
