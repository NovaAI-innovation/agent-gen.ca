services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '3000:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-mainnet-beta}
      NEXT_PUBLIC_SOLANA_RPC_HTTP: ${NEXT_PUBLIC_SOLANA_RPC_HTTP:-https://api.mainnet-beta.solana.com}
      NEXT_PUBLIC_SOLANA_RPC_WS: ${NEXT_PUBLIC_SOLANA_RPC_WS:-wss://api.mainnet-beta.solana.com}
      NEXT_PUBLIC_SOLANA_RPC_FALLBACK: ${NEXT_PUBLIC_SOLANA_RPC_FALLBACK:-}
      NEXT_PUBLIC_USDC_MINT: ${NEXT_PUBLIC_USDC_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      NEXT_PUBLIC_PLATFORM_FEE_BPS: ${NEXT_PUBLIC_PLATFORM_FEE_BPS:-250}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentgen}:${POSTGRES_PASSWORD:-agentgen-prod-local}@db:5432/${POSTGRES_DB:-agentgen}
      SECRET_KEY: ${SECRET_KEY:-agentgen-prod-local-secret-change-me}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-strict}
      JWT_ISSUER: ${JWT_ISSUER:-agent-gen.ca}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agent-gen.ca-web}
      ENFORCE_ALEMBIC_VERSION: ${ENFORCE_ALEMBIC_VERSION:-true}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-mainnet-beta}
      SOLANA_RPC_HTTP: ${SOLANA_RPC_HTTP:-https://api.mainnet-beta.solana.com}
      SOLANA_RPC_WS: ${SOLANA_RPC_WS:-wss://api.mainnet-beta.solana.com}
      SOLANA_RPC_FALLBACK: ${SOLANA_RPC_FALLBACK:-}
      USDC_MINT: ${USDC_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-250}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-agent-gen.ca}
      AUTH_URI: ${AUTH_URI:-https://agent-gen.ca}
      AUTH_CHAIN_ID: ${AUTH_CHAIN_ID:-solana:mainnet}
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentgen}
      POSTGRES_USER: ${POSTGRES_USER:-agentgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgen-prod-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dockerfiles/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgen -d agentgen']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: agentgen_prod
