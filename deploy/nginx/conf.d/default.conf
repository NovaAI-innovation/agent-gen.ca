server {
    listen 80;
    server_name agent-gen.ca www.agent-gen.ca localhost 127.0.0.1;
    
    # Rate limit zones (per client IP, shared across workers via nginx)
    # 10 MB shared memory is enough for ~120k entries.
    limit_req_zone $binary_remote_addr zone=auth_challenge:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=auth_verify:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Backend API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Auth rate limiting: tight per-endpoint limits before proxying
    location ~ ^/api/auth/challenge {
        limit_req zone=auth_challenge burst=5 nodelay;
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/auth/(verify|siws/verify) {
        limit_req zone=auth_verify burst=3 nodelay;
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/auth/refresh {
        limit_req zone=auth_refresh burst=5 nodelay;
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Static files
    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
    }
}

