name: CI/CD Deploy agent-gen.ca

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'poetry'
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Backend tests & lint
      working-directory: ./backend
      run: |
        poetry install
        poetry run pytest
        poetry run black --check .
        poetry run isort --check .
        poetry run flake8 .
        poetry run mypy .

    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Frontend tests & lint
      working-directory: ./frontend
      run: |
        npm ci
        npm run lint
        npm run build --if-present

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build & push backend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/dockerfiles/Dockerfile.backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & push frontend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/dockerfiles/Dockerfile.frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-backend:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Backend + DB to Railway
      uses: railwayapp/action@v1
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
      with:
        command: railway up

  deploy-frontend:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Frontend to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
        vercel-args: '--prod'
